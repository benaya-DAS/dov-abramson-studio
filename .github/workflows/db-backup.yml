# Twice-daily backup of the Supabase database to Google Drive, keeping the
# last 30 days. Setup and restore instructions: docs/backups.md.
name: DB backup

on:
  schedule:
    # 06:23 / 18:23 Israel time in winter (07:23 / 19:23 in summer) - cron
    # here is always UTC.
    - cron: "23 4,16 * * *"
  workflow_dispatch:

# A backup and a restore must never run at the same time.
concurrency:
  group: db-backup-restore
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      # Only files rclone itself created are visible to it - not the rest
      # of the Drive.
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      # The backup Google account's token, from `rclone authorize` - see
      # docs/backups.md. Files land in that account's My Drive.
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      # db-backups/dump: the real backups (restores read from here).
      # db-backups/excel: read-only Excel copies. Each keeps 30 days.
      BACKUP_DIR: gdrive:db-backups
      DUMP_DIR: gdrive:db-backups/dump
      EXCEL_DIR: gdrive:db-backups/excel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: .github/scripts/install-db-tools.sh

      - name: Prepare Drive token
        run: .github/scripts/gdrive-token.sh

      - name: Dump database
        id: dump
        run: echo "file=$(scripts/db-backup/backup.sh "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Drive
        run: rclone copy "${{ steps.dump.outputs.file }}" "$DUMP_DIR"

      # A readable Excel copy next to the dump (one sheet per board), for
      # looking things up without restoring. After the dump's own upload,
      # so a problem here never costs the real backup.
      - name: Excel copy
        run: |
          pip install --quiet openpyxl
          xlsx="${DUMP_FILE%.dump}.xlsx"
          scripts/db-backup/export-xlsx.py "$xlsx"
          rclone copy "$xlsx" "$EXCEL_DIR"
        env:
          DUMP_FILE: ${{ steps.dump.outputs.file }}

      # Files from before the dump/excel folders existed sat directly in
      # db-backups - sort them in. A no-op once there are none left.
      # One file at a time: a directory-level `rclone move` refuses a
      # destination inside its own source ("overlapping remotes").
      - name: Sort older files into folders
        run: |
          rclone lsf "$BACKUP_DIR" --files-only --max-depth 1 --include "studio-backup_*.{dump,xlsx}" |
            while IFS= read -r f; do
              case "$f" in
                *.dump) dest="$DUMP_DIR" ;;
                *) dest="$EXCEL_DIR" ;;
              esac
              echo "Moving $f"
              rclone moveto "$BACKUP_DIR/$f" "$dest/$f"
            done

      # Only after a successful upload, so a run of failed backups can never
      # age out the last good ones.
      - name: Delete backups older than 30 days
        run: |
          rclone delete "$DUMP_DIR" --max-depth 1 --min-age 30d --include "studio-backup_*.dump"
          rclone delete "$EXCEL_DIR" --max-depth 1 --min-age 30d --include "studio-backup_*.xlsx"
